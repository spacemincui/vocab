<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vocab">
<meta name="theme-color" content="#0f172a">
<title>Vocab</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--txt:#f1f5f9;--mut:#94a3b8;--acc:#6366f1;--ok:#22c55e;--ko:#ef4444}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
header{padding:14px 16px 4px;display:flex;justify-content:space-between;align-items:baseline}
h1{font-size:22px;margin:0}
.stat{color:var(--mut);font-size:14px}
main{flex:1;display:flex;flex-direction:column;padding:12px 16px;overflow:auto}
nav{display:flex;border-top:1px solid #334155;background:#0b1220}
nav button{flex:1;padding:14px 0;background:none;border:0;color:var(--mut);font-size:15px}
nav button.on{color:var(--txt);font-weight:600}
.bar{display:flex;gap:8px;margin-bottom:8px}
.bar select{flex:1;margin:0}
.bar button{width:auto;padding:0 16px;border:0;border-radius:12px;background:#334155;color:#fff;font-size:17px}
.scene{perspective:1000px;flex:1;min-height:240px;max-height:380px;margin:8px 0 16px}
.card{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.card.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;font-size:30px;font-weight:600;box-shadow:0 8px 24px #0006}
.face small{font-size:13px;font-weight:400;color:var(--mut);margin-bottom:10px}
.back{transform:rotateY(180deg);background:var(--acc)}
.back small{color:#e0e7ff}
.hint{text-align:center;color:var(--mut);font-size:13px;margin-bottom:12px}
.row{display:flex;gap:12px}
.row button,.btn{flex:1;padding:16px;border:0;border-radius:14px;font-size:17px;font-weight:600;color:#fff}
.ko{background:var(--ko)}.ok{background:var(--ok)}.pri{background:var(--acc)}.sec{background:#334155}
.empty{text-align:center;color:var(--mut);margin-top:60px;line-height:1.6}
input,select{width:100%;padding:14px;margin:6px 0 12px;border-radius:12px;border:1px solid #334155;background:var(--card);color:var(--txt);font-size:17px}
label{font-size:13px;color:var(--mut)}
.item{display:flex;align-items:center;gap:10px;background:var(--card);padding:12px 14px;border-radius:12px;margin-bottom:8px}
.item div{flex:1}.item small{color:var(--mut);display:block}
.item button{background:none;border:0;color:var(--ko);font-size:20px;padding:6px}
.hidden{display:none}
</style>
</head>
<body>
<header><h1>Vocab</h1><span class="stat" id="stat"></span></header>
<main id="main"></main>
<nav>
  <button data-v="study" class="on">Réviser</button>
  <button data-v="add">Ajouter</button>
  <button data-v="list">Liste</button>
</nav>

<script>
// Boîtes de Leitner : intervalle (en jours) avant la prochaine révision
const INTERVALS=[0,1,2,4,8,16];
const KEY='vocab-cards-v1', SET='vocab-settings-v1', LANGS='vocab-langs-v1', DEL='vocab-deleted-v1';
const DEFAULT_LANG='Anglais';
const BASE_LANGS=['Anglais','Français'];

const read=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}};
const write=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};

let cards=read(KEY,[]);
cards.forEach(c=>{if(!c.lang)c.lang=DEFAULT_LANG});   // anciennes cartes sans langue
let settings=Object.assign({lang:DEFAULT_LANG,rev:false},read(SET,{}));
let customLangs=read(LANGS,[]);
let view='study', flipped=false, current=null;

const save=()=>write(KEY,cards);
const saveSettings=()=>write(SET,settings);
const day=()=>Math.floor(Date.now()/864e5);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const keyOf=c=>(c.front+'|'+c.back+'|'+(c.lang||DEFAULT_LANG)).toLowerCase();
const deleted=()=>read(DEL,[]);

function languages(){
  const all=[...BASE_LANGS,...customLangs,...cards.map(c=>c.lang)];
  return [...new Set(all)];
}
const inLang=()=>cards.filter(c=>c.lang===settings.lang);
const due=()=>inLang().filter(c=>c.next<=day());

function langSelect(id,selected){
  return `<select id="${id}">${languages().map(l=>`<option ${l===selected?'selected':''}>${esc(l)}</option>`).join('')}</select>`;
}

// Charge mots.json (hébergé avec l'appli) et ajoute les cartes absentes
async function sync(){
  try{
    const r=await fetch('mots.json?'+Date.now(),{cache:'no-store'});
    if(!r.ok)return;
    const d=await r.json();
    if(!Array.isArray(d))return;
    const have=new Set(cards.map(keyOf).concat(deleted()));
    let n=0;
    d.forEach(x=>{
      if(!x||!x.front||!x.back)return;
      const c={id:Date.now()+Math.random(),front:String(x.front),back:String(x.back),lang:x.lang?String(x.lang):DEFAULT_LANG,box:0,next:day()};
      if(!have.has(keyOf(c))){cards.push(c);have.add(keyOf(c));n++}
    });
    if(n){save();render()}
  }catch(e){}
}

function pick(){
  const d=due();
  current=d.length?d[Math.floor(Math.random()*d.length)]:null;
  flipped=false;
}

function render(){
  const m=document.getElementById('main');
  document.getElementById('stat').textContent=inLang().length+' cartes · '+due().length+' à revoir';
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
  const L=settings.lang;

  if(view==='study'){
    const bar=`<div class="bar">${langSelect('lang',L)}<button id="rev" title="Inverser le sens">⇄</button></div>`;
    if(!inLang().length){m.innerHTML=bar+`<div class="empty">Aucune carte en ${esc(L)}.<br>Va dans « Ajouter » pour commencer.</div>`;bindBar();return}
    if(!current||!cards.includes(current)||current.lang!==L) pick();
    if(!current){m.innerHTML=bar+'<div class="empty">🎉 Tout est révisé pour aujourd\'hui !<br>Reviens demain.</div>';bindBar();return}
    const q=settings.rev?current.back:current.front, a=settings.rev?current.front:current.back;
    const ql=settings.rev?'Traduction':L, al=settings.rev?L:'Traduction';
    m.innerHTML=bar+`<div class="scene" id="scene"><div class="card ${flipped?'flip':''}" id="card">
      <div class="face"><small>${esc(ql)}</small>${esc(q)}</div>
      <div class="face back"><small>${esc(al)}</small>${esc(a)}</div></div></div>
      <div class="hint">${flipped?'Tu le savais ?':'Touche la carte pour la retourner'}</div>
      <div class="row ${flipped?'':'hidden'}">
        <button class="ko" id="no">À revoir</button><button class="ok" id="yes">Je sais</button></div>`;
    bindBar();
    document.getElementById('scene').onclick=()=>{flipped=!flipped;render()};
    if(flipped){
      document.getElementById('no').onclick=()=>answer(false);
      document.getElementById('yes').onclick=()=>answer(true);
    }

  } else if(view==='add'){
    m.innerHTML=`<label>Langue</label>
      <div class="bar">${langSelect('l',L)}<button id="newlang" title="Nouvelle langue">＋</button></div>
      <label>Mot ou phrase (dans la langue choisie)</label><input id="f" autocomplete="off" autocapitalize="none">
      <label>Traduction</label><input id="b" autocomplete="off" autocapitalize="none">
      <button class="btn pri" id="addb" style="width:100%">Ajouter la carte</button>
      <div style="height:24px"></div>
      <div class="row"><button class="sec" id="exp">Exporter</button><button class="sec" id="imp">Importer</button></div>
      <input type="file" id="file" accept="application/json" class="hidden">`;
    document.getElementById('l').onchange=e=>{settings.lang=e.target.value;saveSettings();render()};
    document.getElementById('newlang').onclick=()=>{
      const n=(prompt('Nom de la nouvelle langue (ex. Espagnol) :')||'').trim();
      if(!n)return;
      const ex=languages().find(l=>l.toLowerCase()===n.toLowerCase());
      if(!ex){customLangs.push(n);write(LANGS,customLangs)}
      settings.lang=ex||n;saveSettings();render();
    };
    const add=()=>{
      const f=document.getElementById('f').value.trim(),b=document.getElementById('b').value.trim();
      if(!f||!b)return;
      cards.push({id:Date.now()+Math.random(),front:f,back:b,lang:document.getElementById('l').value,box:0,next:day()});
      save();render();document.getElementById('f').focus();
    };
    document.getElementById('addb').onclick=add;
    document.getElementById('b').onkeydown=e=>{if(e.key==='Enter')add()};
    document.getElementById('exp').onclick=()=>{
      const a=document.createElement('a');
      a.href=URL.createObjectURL(new Blob([JSON.stringify(cards,null,1)],{type:'application/json'}));
      a.download='vocab.json';a.click();
    };
    document.getElementById('imp').onclick=()=>document.getElementById('file').click();
    document.getElementById('file').onchange=e=>{
      const r=new FileReader();
      r.onload=()=>{try{
        const d=JSON.parse(r.result);
        if(Array.isArray(d)){
          d.filter(x=>x&&x.front&&x.back).forEach(x=>cards.push({id:Date.now()+Math.random(),front:String(x.front),back:String(x.back),lang:x.lang||DEFAULT_LANG,box:x.box||0,next:x.next||day()}));
          save();view='list';render();
        }
      }catch(_){alert('Fichier invalide')}};
      r.readAsText(e.target.files[0]);
    };

  } else {
    const bar=`<div class="bar">${langSelect('lang',L)}</div>`;
    const list=inLang();
    m.innerHTML=bar+(list.length?list.map(c=>`<div class="item"><div>${esc(c.front)}<small>${esc(c.back)} · boîte ${c.box+1}</small></div><button data-id="${c.id}">✕</button></div>`).join(''):'<div class="empty">Liste vide.</div>');
    bindBar();
    m.querySelectorAll('.item button').forEach(b=>b.onclick=()=>{
      if(confirm('Supprimer cette carte ?')){
        const c=cards.find(c=>String(c.id)===b.dataset.id);
        if(c)write(DEL,deleted().concat(keyOf(c)));
        cards=cards.filter(c=>String(c.id)!==b.dataset.id);save();render();
      }
    });
  }
}

function bindBar(){
  const s=document.getElementById('lang');
  if(s)s.onchange=e=>{settings.lang=e.target.value;saveSettings();pick();render()};
  const r=document.getElementById('rev');
  if(r)r.onclick=()=>{settings.rev=!settings.rev;saveSettings();flipped=false;render()};
}

function answer(ok){
  current.box=ok?Math.min(current.box+1,INTERVALS.length-1):0;
  current.next=ok?day()+INTERVALS[current.box]:day();
  save();pick();render();
}

document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{view=b.dataset.v;if(view==='study')pick();render()});
render();
sync();
document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync()});
</script>
</body>
</html>
